<ul class="nav">
  <li class="nav-item">
    <button class="nav-link active" id="0" (click)="selectList($event.target)">ALl Tasks</button>
  </li>
  <li class="nav-item">
    <button class="nav-link" id="1" (click)="selectList($event.target)">Done Tasks</button>
  </li>
  <li class="nav-item">
    <button class="nav-link" id="2" (click)="selectList($event.target)">Not Done Tasks</button>
  </li>
</ul>
@switch (list) {
  @case (1) {
    <app-done-tasks (taskEmitter)="change($event)" [tasks]="doneList"></app-done-tasks>
  }
  @case (2) {
    <app-not-done-tasks (taskEmitter)="change($event)" [tasks]="notdoneList"></app-not-done-tasks>
  }
  @default {
    <div class="d-flex flex-wrap">
      @if (count > 0) {
        @for (t of taskList; track t.ID) {
          <app-taskcard (taskEmitter)="change($event)" [task]="t"></app-taskcard>
        }
      } 
      @else {
        <p>No tasks Yet 😓😓</p>
      }
    </div>
  }
}
