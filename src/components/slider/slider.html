<div id="carouselExampleAutoplaying" class="carousel slide d-block text-center mx-5  " data-bs-ride="carousel">
    <div class="carousel-indicators">
        @for ( image of Images; track image; let indx = $index) {
        <button type="button" data-bs-target="#carouselExampleAutoplaying" (click)="setImage($event)" id="{{indx}}"
            [class]="idx===indx? 'active' : ''"></button>
        }
    </div>
    <div class="carousel-inner">
        @for ( image of Images; track image; let indx = $index) {
        <div class="carousel-item " [class]="idx===indx? 'active' : ''">
            <img src={{image}}  style="height: 70vh;"  class="d-block  w-100" alt="imageAlt">
        </div>
        }
    </div>
    <button class="carousel-control-prev" type="button" (click)="prev()" data-bs-target="#carouselExampleAutoplaying">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" (click)="next()" data-bs-target="#carouselExampleAutoplaying">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>
