<style>
    textarea {
        resize: none;
    }
</style>
<div class="container">
    <div class="mb-3">
        <label for="title" class="form-label">TaskTitle</label>
        <input (input)="Title($event.target.value)" type="text" class="form-control" id="title" placeholder="title...">
    </div>
    <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea (input)="Des($event)" class="form-control" id="description" rows="3"></textarea>
    </div>
    <select (change)="P($event)" class="form-select" aria-label="Default select example">
        <option value="" selected>Priority</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
    </select>
    <input (change)="Date($event)" type="date" class="form-control mb-2">
    <select (input)="C($event)"  class="form-select" aria-label="Default select example">
        <option value="" selected>Category</option>
        <option value="work">Work</option>
        <option value="personal">Personal</option>
        <option value="study">Study</option>
    </select>
    <div class="mb-3">
        <label for="tag" class="form-label">Tag</label>
        <textarea (input)="Tag($event)" class="form-control" id="tag" rows="2"></textarea>
    </div>
    <button (click)="register()" class="btn btn-primary">Register</button>
</div>
